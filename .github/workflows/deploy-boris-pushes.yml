# Vercel blocks deploys of commits by authors outside the Vercel team, and Boris isn't on it.
# Deploying without the .git folder leaves Vercel no commit author to check.
# Matched by GitHub username, since Boris commits from more than one email address.
name: Deploy Boris's pushes

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.author.username == 'borisnezlobin'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_dwvhZslf3zImPm9iPzwTvxhq
      VERCEL_PROJECT_ID: prj_07DVNdEQBnVgzCSpyt6TroTon8Au
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf .git
      - run: npx --yes vercel@63.1.2 deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
