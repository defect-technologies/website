# Copies the primary database (Supabase) over the backup (Neon) every week. A failed run leaves the last backup intact.
name: Back up the database

on:
  schedule:
    - cron: "17 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/backup-database.mts
        env:
          FROM_DATABASE_URL: ${{ secrets.BACKUP_FROM_DATABASE_URL }}
          TO_DATABASE_URL: ${{ secrets.BACKUP_TO_DATABASE_URL }}
